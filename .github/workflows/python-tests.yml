name: Python tests and HTML documentation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Generate HTML source-code documentation
        run: python scripts/generate_docs.py
      - name: Run automated tests and create reports
        run: |
          python -m pytest -q --junitxml=docs/test-results.xml --html=docs/test_report.html --self-contained-html
      - name: Upload CI documentation and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mma3001-html-docs-and-test-report
          path: |
            docs/html/
            docs/test_report.html
            docs/test-results.xml
      - name: Commit generated reports to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/html docs/test_report.html docs/test-results.xml
          if ! git diff --cached --quiet; then
            git commit -m "Generate HTML API docs and pytest report [skip ci]"
            git push
          fi
